<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tree Controller</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="/web/style.css">
</head>

<body>
  <h1>Tree Controller</h1>

  <div class="row">
    <button onclick="prev()">⏮ Prev</button>
    <button onclick="next()">⏭ Next</button>
    <button onclick="toggle()">⏯ Pause</button>
    <div class="controls">
      <input id="shuffleDuration" type="number" value="30" min="1">
      <button id="shuffleBtn">Shuffle</button>
    </div>
  </div>

  <div class="row">
    <label>Speed</label>
    <input type="range" min="0.1" max="2.0" step="0.05"
           id="speed" oninput="setSpeed(this.value)">
    <div id="speedLabel" class="status"></div>
  </div>

  <div class="row">
    <label>Animations</label>
    <div id="animations"></div>
  </div>

  <div id="status" class="status"></div>

  <script src="/web/app.js"></script>
</body>
</html>
